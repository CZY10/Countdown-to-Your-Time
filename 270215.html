<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>倒计时</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #e5e7eb;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    }
    .countdown {
      text-align: center;
      letter-spacing: 0.08em;
    }
    .countdown h1 {
      font-size: 32px;
      margin-bottom: 16px;
      font-weight: 500;
    }
    .time {
      display: flex;
      gap: 16px;
      justify-content: center;
      font-size: 24px;
    }
    .time-block {
      min-width: 90px;
      padding: 12px 16px;
      border-radius: 12px;
      background: radial-gradient(circle at top left, #1f2937, #020617);
      border: 1px solid rgba(148, 163, 184, 0.35);
    }
    .time-block span.value {
      display: block;
      font-size: 28px;
      font-variant-numeric: tabular-nums;
    }
    .time-block span.label {
      display: block;
      margin-top: 4px;
      font-size: 12px;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="countdown">
    <h1>距离 2027-02-15 倒计时</h1>
    <div class="time">
      <div class="time-block">
        <span class="value" id="days">0</span>
        <span class="label">天</span>
      </div>
      <div class="time-block">
        <span class="value" id="hours">0</span>
        <span class="label">小时</span>
      </div>
      <div class="time-block">
        <span class="value" id="minutes">0</span>
        <span class="label">分钟</span>
      </div>
      <div class="time-block">
        <span class="value" id="seconds">0</span>
        <span class="label">秒</span>
      </div>
    </div>
  </div>

  <script>
    // 目标时间：2027-02-15 00:00:00（本地时间）
    const targetDate = new Date(2027, 1, 15, 0, 0, 0); 
    // 注意：月份从 0 开始，1 表示 2 月

    function updateCountdown() {
      const now = new Date();
      const diff = targetDate.getTime() - now.getTime();

      if (diff <= 0) {
        document.getElementById('days').textContent = 0;
        document.getElementById('hours').textContent = 0;
        document.getElementById('minutes').textContent = 0;
        document.getElementById('seconds').textContent = 0;
        return;
      }

      const totalSeconds = Math.floor(diff / 1000);
      const days = Math.floor(totalSeconds / (24 * 3600));
      const hours = Math.floor((totalSeconds % (24 * 3600)) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      document.getElementById('days').textContent = days;
      document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
      document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
      document.getElementById('seconds').textContent = seconds.toString().padStart(2, '0');
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
